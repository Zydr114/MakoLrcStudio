<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Mako 打轴工作区操作原型</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f5f7f0;
      color: #20271f;
      font:
        14px system-ui,
        sans-serif;
    }
    button,
    input {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid #c4ccbf;
      background: #fff;
      border-radius: 18px;
      padding: 8px 16px;
    }
    button:focus-visible {
      outline: 3px solid #536b56;
    }
    header {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 32px;
      border-bottom: 1px solid #dce2d7;
    }
    header strong {
      font-size: 22px;
    }
    main {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 16px;
      margin: 16px;
      height: calc(100vh - 148px);
    }
    aside,
    article {
      background: #fff;
      border-radius: 20px;
      padding: 16px;
      min-width: 0;
    }
    aside button {
      display: block;
      width: 100%;
      text-align: left;
      margin: 8px 0;
      padding: 12px;
      background: #eff4e9;
    }
    article {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .heading,
    .cue,
    .tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .heading {
      color: #626b5e;
    }
    .cue {
      min-height: 72px;
      background: #edf3e7;
      padding: 12px 20px;
      border-radius: 16px;
    }
    .target {
      font-size: 40px;
      font-weight: 600;
    }
    .badge {
      font-size: 13px;
      color: #536b56;
    }
    .primary {
      background: #536b56;
      color: white;
      border: 0;
    }
    .preview {
      font-size: 30px;
      text-align: center;
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
    }
    .preview .playing {
      color: #536b56;
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-underline-offset: 7px;
    }
    .segments {
      display: flex;
      align-items: center;
      gap: 0;
      min-height: 48px;
    }
    .segment {
      border: 1px solid #d1dacb;
      padding: 7px 15px;
      background: #f7f9f4;
      border-radius: 8px;
    }
    .segment.selected {
      outline: 2px solid #536b56;
    }
    .divider {
      padding: 6px 4px;
      border: 0;
      background: transparent;
      cursor: ew-resize;
      color: #536b56;
    }
    .wave {
      flex: 1;
      min-height: 180px;
      position: relative;
      border-radius: 10px;
      background: #f2f5ed;
      overflow: hidden;
    }
    .ruler {
      height: 26px;
      display: flex;
      justify-content: space-between;
      padding: 4px 12px;
      color: #656f61;
    }
    svg {
      position: absolute;
      width: 100%;
      height: calc(100% - 50px);
      top: 50px;
      pointer-events: none;
    }
    .region {
      position: absolute;
      top: 28px;
      bottom: 0;
      background: #9eae7b30;
      border: 0;
      border-left: 1px solid #8d9c7b;
      border-radius: 0;
      padding: 0;
    }
    .region:nth-of-type(even) {
      background: #709ba830;
    }
    .region.selected {
      outline: 2px solid #536b56;
      outline-offset: -2px;
    }
    .region span {
      position: absolute;
      top: 3px;
      left: 0;
      right: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .boundary {
      position: absolute;
      width: 12px;
      top: 26px;
      bottom: 0;
      padding: 0;
      border: 0;
      border-left: 2px solid #536b56;
      border-radius: 0;
      background: transparent;
      transform: translateX(-1px);
      cursor: ew-resize;
      touch-action: none;
    }
    .cursor {
      position: absolute;
      top: 22px;
      bottom: 0;
      border-left: 2px solid #282f26;
      pointer-events: none;
    }
    .fields {
      display: flex;
      gap: 16px;
      align-items: center;
      min-height: 40px;
    }
    .fields input {
      width: 115px;
      border: 1px solid #c4ccbf;
      border-radius: 8px;
      padding: 7px;
    }
    footer {
      height: 60px;
      background: #e9eee4;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 24px;
    }
    .tools button {
      padding: 5px 12px;
    }
    .pending {
      border-bottom: 3px dashed #536b56;
    }
    small {
      color: #626b5e;
    }
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
      aside {
        display: none;
      }
    }
  </style>
  <header>
    <strong>mako</strong
    ><span
      >导入文本　›　整理文本　›　歌词行打轴　›　<strong>逐字打轴</strong></span
    >
  </header>
  <main>
    <aside>
      <strong>歌词　1 / 3</strong
      ><button>01　今日も君を待っている<br /><small>00:12.000</small></button
      ><button>02　微风吹过窗口<br /><small>00:16.200</small></button
      ><button>03　I'll be waiting<br /><small>00:20.000</small></button>
    </aside>
    <article>
      <div class="heading">
        <span>第 1 / 3 行</span><span id="count"></span>
      </div>
      <div class="cue">
        <div>
          <span class="badge" id="status">准备</span>　<strong
            class="target"
            id="target"
            >今</strong
          ><small id="last"></small>
        </div>
        <button id="record" class="primary">开始打轴　Enter</button>
      </div>
      <div class="preview" id="preview" aria-label="实时歌词预览"></div>
      <div class="tools">
        <div class="segments" id="segments"></div>
        <button id="split">调整切分</button
        ><span id="split-actions" hidden
          ><button id="apply">应用</button
          ><button id="cancel">取消</button></span
        >
      </div>
      <div class="wave" id="wave">
        <div class="ruler">
          <span>12.0</span><span>13.0</span><span>14.0</span><span>15.0</span
          ><span>16.0</span>
        </div>
        <svg viewBox="0 0 1000 180" preserveAspectRatio="none">
          <path
            id="peaks"
            stroke="#626f5c"
            fill="none"
            stroke-width="1.5"
          ></path>
        </svg>
        <div id="regions"></div>
        <div class="cursor" id="cursor"></div>
      </div>
      <div class="fields">
        <strong id="selected"></strong
        ><label>起点 <input id="start" type="number" step="10" /></label
        ><label>下一项 <input id="end" type="number" step="10" /></label
        ><button id="review">试听边界</button
        ><label><input id="loop" type="checkbox" />循环</label>
      </div>
    </article>
  </main>
  <footer>
    <button id="play">播放 / 暂停　Space</button><strong id="clock"></strong
    ><label
      >速度
      <select id="rate">
        <option>1</option>
        <option>0.75</option>
        <option>0.5</option>
      </select></label
    ><button id="rewind">退回刚记</button><button id="fit">适合当前行</button>
  </footer>
  <script>
    const $ = (id) => document.getElementById(id);
    let tokens = ["今", "日", "も", "君", "を", "待って", "いる"],
      starts = [12000, 12400, 12800, 13250, 13600, 14000, 14800],
      terminal = 15700,
      position = 12000,
      selected = 0,
      playing = false,
      armed = false,
      pending = 0,
      last = 0,
      frame = 0,
      splitDraft = null,
      range = null;
    $("peaks").setAttribute(
      "d",
      Array.from({ length: 500 }, (_, i) => {
        const height =
          12 + Math.abs(Math.sin(i * 0.17) * Math.cos(i * 0.037)) * 70;
        return `M${i * 2} ${90 - height}v${height * 2}`;
      }).join(""),
    );
    const pct = (ms) => (ms - 12000) / 40;
    function render() {
      const active = starts.findIndex(
        (start, i) =>
          position >= start && position < (starts[i + 1] ?? terminal),
      );
      $("preview").innerHTML = tokens
        .map(
          (text, i) =>
            `<span class="${i === active ? "playing" : ""}">${text}</span>`,
        )
        .join("");
      $("segments").innerHTML = tokens
        .map(
          (text, i) =>
            `<button class="segment ${i === selected ? "selected" : ""} ${armed && i === pending ? "pending" : ""}" data-select="${i}">${text}</button>${i < tokens.length - 1 ? `<button class="divider" draggable="true" data-divider="${i}" aria-label="文字分隔线 ${i + 1}">│</button>` : ""}`,
        )
        .join("");
      $("regions").innerHTML = tokens
        .map(
          (text, i) =>
            `<button class="region ${i === selected ? "selected" : ""}" data-select="${i}" style="left:${pct(starts[i])}%;width:${pct(starts[i + 1] ?? terminal) - pct(starts[i])}%"><span>${text}</span></button><button class="boundary" data-boundary="${i}" style="left:${pct(starts[i])}%" aria-label="${text}时间边界"></button>`,
        )
        .join("");
      $("cursor").style.left = pct(position) + "%";
      $("clock").textContent = (position / 1000).toFixed(3);
      $("selected").textContent = "「" + tokens[selected] + "」";
      $("count").textContent = pending + " / " + tokens.length;
      $("status").textContent = armed
        ? playing
          ? "打轴"
          : "暂停"
        : playing
          ? "试听"
          : "准备";
      $("target").textContent = tokens[pending] ?? "收尾";
      $("record").textContent =
        armed && playing
          ? "记" +
            (tokens[pending] ? "「" + tokens[pending] + "」起点" : "收尾") +
            "　Enter"
          : armed
            ? "继续打轴　Enter"
            : "开始打轴　Enter";
      if (document.activeElement !== $("start"))
        $("start").value = starts[selected];
      if (document.activeElement !== $("end"))
        $("end").value = starts[selected + 1] ?? terminal;
    }
    function enter() {
      if (!playing || !armed) {
        playing = true;
        armed = true;
        return;
      }
      if (pending < tokens.length) {
        starts[pending] = Math.round(position);
        $("last").textContent =
          "　刚记：" + tokens[pending] + " " + (position / 1000).toFixed(3);
        pending++;
      } else {
        terminal = Math.round(position);
        playing = false;
        armed = false;
      }
    }
    $("record").onclick = enter;
    $("play").onclick = () => (playing = !playing);
    $("review").onclick = () => {
      armed = false;
      range = [
        Math.max(12000, starts[selected] - 400),
        Math.min(16000, starts[selected] + 600),
      ];
      position = range[0];
      playing = true;
    };
    $("rewind").onclick = () => {
      pending = Math.max(0, pending - 1);
      position = Math.max(12000, starts[pending] - 1000);
      playing = false;
      armed = true;
    };
    $("fit").onclick = () => {
      position = 12000;
    };
    $("start").onchange = () =>
      (starts[selected] = Math.max(
        selected ? starts[selected - 1] + 1 : 12000,
        Math.min(
          Number($("start").value),
          (starts[selected + 1] ?? terminal) - 1,
        ),
      ));
    $("end").onchange = () =>
      selected + 1 < tokens.length
        ? (starts[selected + 1] = Math.max(
            starts[selected] + 1,
            Number($("end").value),
          ))
        : (terminal = Number($("end").value));
    $("split").onclick = () => {
      playing = false;
      splitDraft = [...tokens];
      $("split-actions").hidden = false;
      $("split").hidden = true;
    };
    $("cancel").onclick = () => {
      tokens = splitDraft;
      splitDraft = null;
      $("split-actions").hidden = true;
      $("split").hidden = false;
    };
    $("apply").onclick = () => {
      splitDraft = null;
      $("split-actions").hidden = true;
      $("split").hidden = false;
    };
    let drag = null;
    $("wave").onpointerdown = (e) => {
      if (e.target.dataset.boundary !== undefined) {
        drag = Number(e.target.dataset.boundary);
        selected = drag;
        e.target.setPointerCapture(e.pointerId);
      } else if (e.target.closest("[data-select]"))
        selected = Number(e.target.closest("[data-select]").dataset.select);
      else {
        const box = $("wave").getBoundingClientRect();
        position = 12000 + ((e.clientX - box.left) / box.width) * 4000;
      }
    };
    $("wave").onpointermove = (e) => {
      if (drag === null) return;
      const box = $("wave").getBoundingClientRect();
      starts[drag] = Math.max(
        drag ? starts[drag - 1] + 1 : 12000,
        Math.min(
          Math.round(12000 + ((e.clientX - box.left) / box.width) * 4000),
          (starts[drag + 1] ?? terminal) - 1,
        ),
      );
    };
    $("wave").onpointerup = () => (drag = null);
    $("segments").onclick = (e) => {
      const el = e.target.closest("[data-select]");
      if (el) selected = Number(el.dataset.select);
    };
    $("segments").ondragstart = (e) => {
      if (!splitDraft) return e.preventDefault();
      e.dataTransfer.setData("text/plain", e.target.dataset.divider);
    };
    $("segments").ondragover = (e) => e.preventDefault();
    $("segments").ondrop = (e) => {
      e.preventDefault();
      if (!splitDraft) return;
      const from = Number(e.dataTransfer.getData("text/plain"));
      const chars = new Intl.Segmenter("ja", { granularity: "grapheme" });
      const next = [...chars.segment(tokens[from + 1] || "")].map(
        (x) => x.segment,
      );
      if (next.length > 1) {
        tokens[from] += next.shift();
        tokens[from + 1] = next.join("");
      }
    };
    window.onkeydown = (e) => {
      if (e.target.matches("input,select") || e.repeat) return;
      if (e.code === "Enter") {
        e.preventDefault();
        enter();
      }
      if (e.code === "Space") {
        e.preventDefault();
        playing = !playing;
      }
      if (e.code === "Escape") {
        playing = false;
        armed = false;
      }
    };
    function tick(now) {
      if (playing)
        position += Math.min(50, now - last) * Number($("rate").value);
      last = now;
      if (range && position >= range[1]) {
        if ($("loop").checked) position = range[0];
        else {
          playing = false;
          range = null;
        }
      }
      if (position >= 16000) {
        position = 16000;
        playing = false;
      }
      if (!drag) render();
      else $("cursor").style.left = pct(position) + "%";
      frame = requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</html>
